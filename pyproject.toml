[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsam"
version = "0.7.0"
description = "TSAM Stage 0 — Deterministic Cognitive Rewrite Engine for Software Synthesis"
requires-python = ">=3.12"
dependencies = []   # stdlib only

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
python_version = "3.12"
